name: SwaliClass CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test-and-build:
    name: Backend CI (.NET 9 & xUnit Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve Solution File
        id: resolve_sln
        run: |
          if [ -f "backend/csharp/SwaliClass.sln" ]; then
            echo "sln=backend/csharp/SwaliClass.sln" >> $GITHUB_OUTPUT
            echo "Found SwaliClass.sln"
          elif [ -f "backend/csharp/BitraHub.sln" ]; then
            echo "sln=backend/csharp/BitraHub.sln" >> $GITHUB_OUTPUT
            echo "Found BitraHub.sln"
          else
            FOUND_SLN=$(find backend -name "*.sln" | head -n 1)
            echo "sln=$FOUND_SLN" >> $GITHUB_OUTPUT
            echo "Found $FOUND_SLN"
          fi

      - name: Restore Dependencies
        run: dotnet restore ${{ steps.resolve_sln.outputs.sln }}

      - name: Build Solution (Clean Architecture)
        run: dotnet build ${{ steps.resolve_sln.outputs.sln }} --configuration Release --no-restore

      - name: Run xUnit Test Suite (Tenant Isolation, Auth & Attendance Rules)
        run: dotnet test ${{ steps.resolve_sln.outputs.sln }} --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  frontend-lint-and-build:
    name: Frontend CI (React, TypeScript & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run ESLint
        run: npm run lint

      - name: Run Build
        run: npm run build
