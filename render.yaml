services:
  - type: web
    name: swaliclass-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: ASAAS_ENVIRONMENT
        value: production
      - key: ASAAS_API_KEY
        sync: false
