version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: swaliclass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swaliclass_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swaliclass_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/csharp
      dockerfile: Dockerfile
    container_name: swaliclass-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=swaliclass_db;Username=postgres;Password=postgres"
      Jwt__Secret: "SwaliClassLocalDevelopmentKeyForDockerComposeMustBeAtLeast32Chars!"
      Jwt__Issuer: "SwaliClass.WebApi"
      Jwt__Audience: "SwaliClass.Clients"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: swaliclass-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: "http://localhost:5000"
    depends_on:
      - api

volumes:
  postgres_data:
